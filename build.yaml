# Build matrix for the GitHub Actions workflow.
# Each entry produces a flashable .uf2 artifact.
---
include:
  - board: nice_nano_v2
    shield: knoble
  - board: nice_nano_v2
    shield: knoble
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: knoble_studio
  # Hi-res wheel (HID Resolution Multiplier) experiment: Windows/Linux honor
  # the multiplier and get smooth, acceleration-free 16x-fine scrolling
  # natively. macOS ignores it and would scroll 16x too fast — do NOT pair
  # this build with a Mac. See docs/scroll-feel-handoff.md.
  - board: nice_nano_v2
    shield: knoble
    cmake-args: -DCONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y
    artifact-name: knoble_hires
