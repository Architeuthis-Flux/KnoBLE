# KnoBLE user configuration (merged into the build for board+shield).

# --- Bluetooth ---
CONFIG_ZMK_BLE=y
# Stronger TX for a knob that may sit far from the host:
# CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# --- Power ---
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000          # 15 min to deep sleep
CONFIG_ZMK_EXT_POWER=y

# --- RGB underglow (3x WS2812) ---
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0          # solid color
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=0          # red, like the v2.1 default

# --- Drivers ---
# In-tree Zephyr AS5600 angle sensor driver.
# NOTE: if the build reports an unknown symbol here after a ZMK/Zephyr
# upgrade, the symbol was renamed to CONFIG_AMS_AS5600 in Zephyr 4.x.
CONFIG_AS5600=y

# --- Knob engine debugging (enable with a USB console when bringing up) ---
# CONFIG_ZMK_USB_LOGGING=y
# CONFIG_KNOB_ENGINE_LOG_LEVEL_DBG=y
