# KnoBLE user configuration (merged into the build for board+shield).

# --- Bluetooth ---
CONFIG_ZMK_BLE=y
# Stronger TX for a knob that may sit far from the host:
# CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# --- Power ---
# Deep sleep OFF on purpose: system-off can only wake on GPIO (the keys) —
# the AS5600 has no interrupt line, so the wheel could never wake it. The
# knob engine dozes instead (AS5600 to LPM3, slow wake-check polling), so
# wheel, pots, AND keys all wake it. Timeout/rate configurable in the app.
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_EXT_POWER=y

# --- LEDs (3x WS2812) ---
# The knob engine drives the strip directly as a live speed gauge
# (blue = slowest divider, green = 1x, red = fastest). ZMK underglow off.
CONFIG_ZMK_RGB_UNDERGLOW=n

# --- Drivers ---
# Explicit so sliders keep working even if battery reporting (which also
# pulls in ADC) is ever disabled.
CONFIG_ADC=y
# In-tree Zephyr AS5600 angle sensor driver (symbol verified against the
# Zephyr revision ZMK v0.3 pins; older Zephyrs called it CONFIG_AS5600).
CONFIG_AMS_AS5600=y

# WS2812 sits on P0.09 (pro micro D10), an nRF52840 NFC pin.
CONFIG_NFCT_PINS_AS_GPIOS=y

# --- Settings channel (companion app) ---
# Second USB HID instance for the raw-HID settings channel (key remap).
CONFIG_USB_HID_DEVICE_COUNT=2

# --- Knob engine debugging ---
# For a debug build, add the `zmk-usb-logging` snippet (locally:
# `west build -S zmk-usb-logging ...`; CI: `snippet:` in build.yaml).
# This level setting only takes effect in such builds.
CONFIG_KNOB_ENGINE_LOG_LEVEL_DBG=y
