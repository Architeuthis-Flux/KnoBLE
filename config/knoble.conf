# KnoBLE user configuration (merged into the build for board+shield).

# --- Bluetooth ---
CONFIG_ZMK_BLE=y
# Stronger TX for a knob that may sit far from the host:
# CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# --- Power ---
CONFIG_ZMK_SLEEP=y
# 15 min to deep sleep
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
CONFIG_ZMK_EXT_POWER=y

# --- RGB underglow (3x WS2812) ---
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y
# Bring-up: keep LEDs on permanently. Re-enable auto-off for battery life
# once the hardware phase is done.
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=n
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
# effect 2 = spectrum (slow rainbow cycle), speed 1 = slowest
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=2
CONFIG_ZMK_RGB_UNDERGLOW_SPD_START=1
# NOTE: underglow state persists in flash settings; if a previous state
# overrides these defaults, hold middle key + tap right key to cycle effects.

# --- Drivers ---
# Explicit so sliders keep working even if battery reporting (which also
# pulls in ADC) is ever disabled.
CONFIG_ADC=y
# In-tree Zephyr AS5600 angle sensor driver (symbol verified against the
# Zephyr revision ZMK v0.3 pins; older Zephyrs called it CONFIG_AS5600).
CONFIG_AMS_AS5600=y

# WS2812 sits on P0.09 (pro micro D10), an nRF52840 NFC pin.
CONFIG_NFCT_PINS_AS_GPIOS=y

# --- Knob engine debugging ---
# For a debug build, add the `zmk-usb-logging` snippet (locally:
# `west build -S zmk-usb-logging ...`; CI: `snippet:` in build.yaml).
# This level setting only takes effect in such builds.
CONFIG_KNOB_ENGINE_LOG_LEVEL_DBG=y
